name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project & Build APK
      run: |
        cordova create avocadoApp com.avocadobar.app "AvocadoBar"
        cd avocadoApp
        cordova platform add android
        rm -rf www/*
        
        # index.html kopyalama (Esnek bulma yöntemi)
        if [ -f "../index.html" ]; then
          cp ../index.html www/index.html
        else
          cp $(find .. -maxdepth 2 -iname "index.html" | head -n 1) www/index.html
        fi

        # Varsa diğer görselleri kopyala
        cp -r ../avocado-bg.jpg www/avocado-bg.jpg || true
        cp -r ../chef.jpg www/chef.jpg || true
        
        if [ -f "../icon.png" ]; then
          cp ../icon.png www/icon.png
          sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
        fi

        cordova build android --no-telemetry

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AvocadoBar-Android-APK
        path: avocadoApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
