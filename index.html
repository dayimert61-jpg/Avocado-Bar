<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avocado Bar - Fresh & Gourmet Tycoon</title>
    <script src="cordova.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #1b381e 0%, #0a170b 100%);
            --card-bg: #274729;
            --card-border: #447247;
            --accent-gold: #f4d03f;
            --avo-green: #588157;
            --text-light: #f4f6f0;
            --primary-red: #e63946;
            --success-green: #38b000;
            --bar-wood: #3e2723;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-light);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            min-height: 100vh;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.8);
            text-align: center;
        }

        .header-stats {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            padding: 8px 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .stat-box { text-align: center; }
        .stat-label { font-size: 0.65rem; color: #a3b18a; text-transform: uppercase; font-weight: 700; }
        .stat-value { font-size: 1.15rem; font-weight: 900; color: var(--accent-gold); }

        /* Customer & Character Section */
        .character-zone {
            width: 100%;
            max-width: 480px;
            background: radial-gradient(circle, #3a5a40 0%, #1e3a1e 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .customer-avatar {
            font-size: 3rem;
            background: rgba(255,255,255,0.1);
            padding: 4px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
        }

        .speech-bubble {
            flex: 1;
            background: #ffffff;
            color: #111;
            padding: 8px 12px;
            border-radius: 12px;
            position: relative;
            font-weight: 800;
        }

        .customer-name { font-size: 0.7rem; color: #588157; text-transform: uppercase; margin-bottom: 2px; }
        .order-name { font-size: 0.95rem; color: #111; }

        /* Visual Dish & Bar Display */
        .visual-display-bar {
            width: 100%;
            max-width: 480px;
            background: var(--bar-wood);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 10px;
            text-align: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.6);
        }

        .dish-illustration {
            width: 80px;
            height: 80px;
            margin: 0 auto 6px auto;
            background: #2b1810;
            border-radius: 50%;
            border: 3px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Preparation Board */
        .game-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
        }

        .section-label {
            font-size: 0.75rem;
            color: #a3b18a;
            margin-bottom: 6px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .plate-area {
            min-height: 60px;
            border: 2px dashed var(--accent-gold);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px;
            margin-bottom: 10px;
            background-color: #132a13;
            flex-wrap: wrap;
        }

        .ingredient-chip {
            background-color: #3a5a40;
            border: 1px solid var(--accent-gold);
            color: var(--text-light);
            padding: 5px 10px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .grid-ingredients {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .btn-ingredient {
            background: linear-gradient(145deg, #3a5a40, #274729);
            color: #fff;
            border: 1px solid #588157;
            padding: 10px 2px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        .btn-ingredient:active { transform: scale(0.95); }

        .action-buttons { display: flex; gap: 8px; }
        
        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
        }

        .btn-serve { background-color: var(--success-green); }
        .btn-clear { background-color: var(--primary-red); }

        .message-box {
            text-align: center;
            font-weight: 900;
            height: 20px;
            margin-top: 6px;
            font-size: 0.9rem;
        }

        .success { color: #38b000; }
        .error { color: #ff4d4d; }
    </style>
</head>
<body>

    <div class="header-title">🥑 AVOCADO BAR TYCOON 🥑</div>

    <div class="header-stats">
        <div class="stat-box">
            <div class="stat-label">Budget</div>
            <div class="stat-value" id="money" style="color:#38b000;">$50</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Customer</div>
            <div class="stat-value" id="customer">#1</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Shift Time</div>
            <div class="stat-value" id="timer" style="color: var(--primary-red);">60s</div>
        </div>
    </div>

    <!-- Character Section -->
    <div class="character-zone">
        <div class="customer-avatar" id="customer-avatar">🧘‍♀️</div>
        <div class="speech-bubble">
            <div class="customer-name" id="customer-type">Fitness Enthusiast</div>
            <div class="order-name">I'd like an <strong id="target-recipe-name" style="color:#274729;">Loading...</strong></div>
            <div id="target-ingredients" style="margin-top: 4px; display:flex; gap:4px; flex-wrap:wrap;"></div>
        </div>
    </div>

    <!-- Visual Dish Display -->
    <div class="visual-display-bar">
        <div class="dish-illustration" id="dish-svg-container">
            <!-- Dynamic SVG Graphic -->
        </div>
        <div style="font-size: 0.85rem; font-weight: 800; color: var(--accent-gold);" id="dish-title">Fresh Order</div>
    </div>

    <!-- Bar Counter -->
    <div class="game-card">
        <div class="section-label">Fresh Prep Counter:</div>
        <div class="plate-area" id="plate">
            <span style="color: #a3b18a; font-size: 0.75rem;">Tap ingredients below to assemble...</span>
        </div>

        <div class="section-label">Avocado Bar Ingredients:</div>
        <div class="grid-ingredients">
            <button class="btn-ingredient" onclick="addIngredient('Avocado')">🥑 Avocado</button>
            <button class="btn-ingredient" onclick="addIngredient('Toast')">🍞 Toast</button>
            <button class="btn-ingredient" onclick="addIngredient('Poached Egg')">🍳 Egg</button>
            <button class="btn-ingredient" onclick="addIngredient('Tomato')">🍅 Tomato</button>
            <button class="btn-ingredient" onclick="addIngredient('Salmon')">🐟 Salmon</button>
            <button class="btn-ingredient" onclick="addIngredient('Lime')">🍋 Lime</button>
            <button class="btn-ingredient" onclick="addIngredient('Olive Oil')">🫒 Olive Oil</button>
            <button class="btn-ingredient" onclick="addIngredient('Chili Flakes')">🌶️ Chili</button>
            <button class="btn-ingredient" onclick="addIngredient('Spinach')">🥬 Spinach</button>
            <button class="btn-ingredient" onclick="addIngredient('Avo Smoothie')">🥤 Smoothie</button>
        </div>

        <div class="action-buttons">
            <button class="btn-action btn-clear" onclick="clearPlate()">Clear Dish</button>
            <button class="btn-action btn-serve" onclick="serveOrder()">Serve Customer</button>
        </div>

        <div class="message-box" id="message"></div>
    </div>

    <script>
        const svgIcons = {
            toast: `<svg width="50" height="50" viewBox="0 0 100 100"><rect x="20" y="30" width="60" height="50" rx="10" fill="#d4a373"/><circle cx="50" cy="50" r="18" fill="#588157"/></svg>`,
            guac: `<svg width="50" height="50" viewBox="0 0 100 100"><ellipse cx="50" cy="60" rx="35" ry="20" fill="#3a5a40"/><circle cx="50" cy="50" r="22" fill="#a3b18a"/></svg>`,
            smoothie: `<svg width="50" height="50" viewBox="0 0 100 100"><rect x="30" y="25" width="40" height="55" rx="8" fill="#588157"/><line x1="50" y1="10" x2="50" y2="30" stroke="#f4d03f" stroke-width="6"/></svg>`
        };

        const customers = [
            { type: "Fitness Enthusiast", avatar: "🧘‍♀️" },
            { type: "Vegan Blogger", avatar: "📸" },
            { type: "Gym Trainer", avatar: "🏋️‍♂️" },
            { type: "Nutritionist", avatar: "🥗" },
            { type: "Tech Developer", avatar: "👨‍💻" }
        ];

        const recipes = [
            { name: "Classic Avocado Toast", ingredients: ["Toast", "Avocado", "Olive Oil"], price: 20, svg: svgIcons.toast },
            { name: "Avocado & Egg Deluxe", ingredients: ["Toast", "Avocado", "Poached Egg", "Chili Flakes"], price: 30, svg: svgIcons.toast },
            { name: "Guacamole Bowl", ingredients: ["Avocado", "Tomato", "Lime", "Chili Flakes"], price: 25, svg: svgIcons.guac },
            { name: "Salmon Avo Feast", ingredients: ["Avocado", "Salmon", "Spinach", "Lime"], price: 40, svg: svgIcons.guac },
            { name: "Green Detox Smoothie", ingredients: ["Avocado", "Spinach", "Avo Smoothie", "Lime"], price: 35, svg: svgIcons.smoothie }
        ];

        let currentRecipe = {};
        let currentCustomer = {};
        let currentPlate = [];
        let score = 0;
        let money = 50;
        let customerCount = 1;
        let timeLeft = 60;
        let timerInterval;

        function startGame() {
            score = 0;
            money = 50;
            customerCount = 1;
            timeLeft = 60;
            updateStats();
            nextOrder();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + "s";
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("⏰ Shift Ended Master Chef!\nFinal Score: " + score + " Pts\nTotal Revenue: $" + money);
                    startGame();
                }
            }, 1000);
        }

        function updateStats() {
            document.getElementById('money').innerText = "$" + money;
            document.getElementById('score').innerText = score;
            document.getElementById('customer').innerText = "#" + customerCount;
        }

        function nextOrder() {
            currentCustomer = customers[Math.floor(Math.random() * customers.length)];
            currentRecipe = recipes[Math.floor(Math.random() * recipes.length)];

            document.getElementById('customer-avatar').innerText = currentCustomer.avatar;
            document.getElementById('customer-type').innerText = currentCustomer.type;
            document.getElementById('target-recipe-name').innerText = currentRecipe.name;
            document.getElementById('dish-title').innerText = currentRecipe.name;
            document.getElementById('dish-svg-container').innerHTML = currentRecipe.svg;
            
            const targetDiv = document.getElementById('target-ingredients');
            targetDiv.innerHTML = '';
            currentRecipe.ingredients.forEach(ing => {
                const chip = document.createElement('span');
                chip.className = 'ingredient-chip';
                chip.innerText = ing;
                targetDiv.appendChild(chip);
            });
            clearPlate();
        }

        function addIngredient(ing) {
            currentPlate.push(ing);
            renderPlate();
        }

        function clearPlate() {
            currentPlate = [];
            renderPlate();
        }

        function renderPlate() {
            const plateDiv = document.getElementById('plate');
            plateDiv.innerHTML = '';
            if(currentPlate.length === 0) {
                plateDiv.innerHTML = '<span style="color: #a3b18a; font-size: 0.75rem;">Tap ingredients below to assemble...</span>';
                return;
            }
            currentPlate.forEach(ing => {
                const chip = document.createElement('span');
                chip.className = 'ingredient-chip';
                chip.innerText = ing;
                plateDiv.appendChild(chip);
            });
        }

        function serveOrder() {
            const msgBox = document.getElementById('message');
            const isCorrect = currentPlate.length === currentRecipe.ingredients.length &&
                              currentPlate.every((val, index) => val === currentRecipe.ingredients[index]);

            if (isCorrect) {
                score += 25;
                money += currentRecipe.price;
                msgBox.className = "message-box success";
                msgBox.innerText = "+$" + currentRecipe.price + " Earned! Perfect Healthy Dish!";
                customerCount++;
                updateStats();
                setTimeout(() => {
                    msgBox.innerText = "";
                    nextOrder();
                }, 800);
            } else {
                money = Math.max(0, money - 5);
                msgBox.className = "message-box error";
                msgBox.innerText = "-$5 Refund! Wrong Recipe!";
                updateStats();
            }
        }

        window.onload = startGame;
    </script>
</body>
</html>
